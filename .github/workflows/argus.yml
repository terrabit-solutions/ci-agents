name: argus

# Argus, the AI review of a suite's pull requests: it comments, approves a clean head, requests
# changes on a blocking issue and fails its check while blocking or important issues are left
# (a suite may make it required), and it moves a clean draft to Ready (label "wip" to keep it a draft). Called by .github/workflows/argus.yml of each suite (which sets the triggers). The
# scripts come from this repository, the rules (ci-agents/argus/REVIEW.md) from the private
# terrabit-solutions/terrabit-claude, plus the suite's own .github/argus/REVIEW.local.md from
# its base branch, so a PR cannot change how it is reviewed.

on:
  workflow_call:
    inputs:
      agents-ref:
        description: Branch or tag of terrabit-solutions/ci-agents for the scripts (the rules follow terrabit-claude main).
        type: string
        default: main
      runs-on:
        description: >-
          JSON runner labels for all the jobs, e.g. '"ubuntu-latest"' for a suite outside
          the org (its own GitHub-hosted minutes). Empty: the org's VPS runners, the light
          jobs on the "agents" ones and Mentor's screenshots on the "odoo" ones, as the tests.
        type: string
        default: ""
      odoo-version:
        description: >-
          The suite's Odoo series (its base branch), e.g. "20.0": the Odoo core Argus
          checks the ORM API against, and the rules it applies (REVIEW.md, per version).
        type: string
        default: "19.0"
      lint:
        description: >-
          Run tb-odoo-lint on the PR's .py/.xml files first; Argus confirms or rejects
          each finding (pilot: off by default).
        type: boolean
        default: false
    # Declared so that a caller outside the organization can pass them by name:
    # `secrets: inherit` only crosses repositories of the same organization.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ARGUS_APP_ID:
        required: false
      ARGUS_APP_PRIVATE_KEY:
        required: false

jobs:
  review:
    # PRs from forks get no secrets: skip them. Mentor's pushes only add the
    # consultant sheet, already audited by its own checker, and the action
    # refuses runs started by a bot: skip them too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != 'mentor-terrabit[bot]'
    # The org has no GitHub-hosted minutes: its VPS runners, on the "agents" ones kept
    # for the agents, so a review does not wait behind the test shards.
    # At job level, so a skipped run (Mentor's push) does not cancel the
    # review in progress; a new push by the author does.
    concurrency:
      group: argus-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runs-on || '["self-hosted", "linux", "agents"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    # A fetch whose HTTP/2 stream stalls hung for 3.5 minutes before failing ("curl 92 ... not
    # closed cleanly", l10n_ro_ent PR 1051): below 1 KB/s for 60 s git now gives up, and
    # actions/checkout retries it.
    env:
      GIT_HTTP_LOW_SPEED_LIMIT: "1000"
      GIT_HTTP_LOW_SPEED_TIME: "60"
    steps:
      # With blob:none the blobs come at `git checkout`, in one request that actions/checkout
      # does not retry (it retries only the fetch): an HTTP 408 from GitHub there failed the
      # review (bitshop PR 3770, "fatal: could not fetch ... from promisor remote"). One more
      # attempt after a pause; actions/checkout recreates the half-made repository itself.
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          fetch-depth: 1
          # Argus may read the workspace: keep the token out of .git/config.
          persist-credentials: false
          # Without the screenshots and the PDFs, half of the tree on l10n_ro_ent: Argus
          # reviews the code. With blob:none only the blobs of the checked-out files come.
          filter: blob:none
          sparse-checkout: |
            /*
            !*.png
            !*.jpg
            !*.jpeg
            !*.gif
            !*.pdf
          sparse-checkout-cone-mode: false
      - name: Pause before the second checkout attempt
        if: steps.checkout.outcome == 'failure'
        run: sleep 20
      - name: Checkout, second attempt
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /*
            !*.png
            !*.jpg
            !*.jpeg
            !*.gif
            !*.pdf
          sparse-checkout-cone-mode: false
      # Argus reads the PR and comments through `gh`, which the runner may lack.
      - name: Install gh if missing
        env:
          GH_VERSION: "2.102.0"
          # SHA-256 of gh_2.102.0_amd64.deb in the official apt repository (cli.github.com/packages).
          GH_DEB_SHA256: "7e54a307f90afdc59796c325ec0c49fb09e6c18537727207a8ac7513584ea5b0"
        run: |
          if ! command -v gh >/dev/null; then
            # From the official apt repository, not GitHub Releases: on 08.11.2026 both
            # github.com/.../releases/download and the release asset API answered 504 for hours.
            # Only the .deb is cached (the tool cache persists on the self-hosted runners); it is
            # checked on every run and extracted fresh, with Python (no dpkg or ar needed).
            deb="$RUNNER_TOOL_CACHE/gh/gh_${GH_VERSION}_amd64.deb"
            mkdir -p "$(dirname "$deb")"
            if ! echo "$GH_DEB_SHA256  $deb" | sha256sum -c --status - 2>/dev/null; then
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 300 \
                -o "$deb" "https://cli.github.com/packages/pool/main/g/gh/gh_${GH_VERSION}_amd64.deb"
              echo "$GH_DEB_SHA256  $deb" | sha256sum -c -
            fi
            rm -rf "$RUNNER_TEMP/gh" && mkdir -p "$RUNNER_TEMP/gh"
            python3 - "$deb" "$RUNNER_TEMP/gh" <<'PY'
          import io, os, sys, tarfile
          deb, out = sys.argv[1], sys.argv[2]
          with open(deb, "rb") as handle:
              data = handle.read()
          assert data[:8] == b"!<arch>\n", "not a .deb"
          pos = 8
          while pos < len(data):
              name = data[pos:pos + 16].decode().strip().rstrip("/")
              size = int(data[pos + 48:pos + 58])
              pos += 60
              if name.startswith("data.tar"):
                  with tarfile.open(fileobj=io.BytesIO(data[pos:pos + size])) as archive:
                      binary = archive.extractfile("./usr/bin/gh").read()
                  with open(os.path.join(out, "gh"), "wb") as handle:
                      handle.write(binary)
                  os.chmod(os.path.join(out, "gh"), 0o755)
                  break
              pos += size + size % 2
          else:
              sys.exit("usr/bin/gh not found in the .deb")
          PY
            echo "$RUNNER_TEMP/gh" >> "$GITHUB_PATH"
          fi
      # The action's own Bun setup needs `unzip`, which the runner lacks: install the npm
      # archive with tar instead, downloaded once per runner (the tool cache persists).
      - name: Install Bun without unzip
        id: bun
        env:
          BUN_VERSION: "1.4.4"
          # SHA-256 of bun-linux-x64-1.4.4.tgz, the official npm package @oven/bun-linux-x64
          # (npm integrity sha512-CHbbkmHVM28T1GFq+6GL4Ao4ujwwYwj1CxFFwEFzLanPfNsId9AhbIP0Q4reWuWBkGimUkoQygrK7Rgjtj3vog==).
          BUN_TGZ_SHA256: "93ca5a2abe45f3bcac6dd55baff8bb06c4ac824b70f89650b54e5c8b80dbef18"
        run: |
          # From npm, not GitHub Releases: on 08.11.2026 both github.com/.../releases/download
          # and the release asset API answered 504 for hours. Only the archive is cached; it is
          # checked on every run and extracted fresh, so a binary altered on the persistent
          # runner is never used.
          tgz="$RUNNER_TOOL_CACHE/bun/bun-linux-x64-${BUN_VERSION}.tgz"
          mkdir -p "$(dirname "$tgz")"
          if ! echo "$BUN_TGZ_SHA256  $tgz" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 300 \
              -o "$tgz" "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${BUN_VERSION}.tgz"
            echo "$BUN_TGZ_SHA256  $tgz" | sha256sum -c -
          fi
          rm -rf "$RUNNER_TEMP/bun" && mkdir -p "$RUNNER_TEMP/bun"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bun" package/bin/bun
          chmod +x "$RUNNER_TEMP/bun/package/bin/bun"
          echo "path=$RUNNER_TEMP/bun/package/bin/bun" >> "$GITHUB_OUTPUT"
      # Claude Code from npm, not the action's own `curl https://claude.ai/install.sh`, which
      # fetches the 290 MB binary on every job: on 09.11.2026 that download kept dying with
      # `Connection reset by peer` and Argus failed before the review. Same scheme as Bun: the
      # archive is cached in the tool cache, checked on every run and extracted fresh. Keep
      # CLAUDE_CODE_VERSION in step with the one claude-code-action pins (v1.0.261: 2.1.310).
      - name: Install Claude Code
        id: claude
        env:
          CLAUDE_CODE_VERSION: "2.1.310"
          # SHA-256 of claude-code-linux-x64-2.1.310.tgz, the official npm package
          # @anthropic-ai/claude-code-linux-x64 (npm integrity
          # sha512-CuzpJrMBbqaR3+1SiLrBtPV3w/cFvcqBfhe9kNskzZ2Fm6KXa7v0l7tM+Ln6l5QLb79WoU0CcacXnYtsygbe6A==).
          CLAUDE_CODE_TGZ_SHA256: "8c90b0170d08fdb370db282c61d74897b834fc2569dd14c35eb1e491212dc6de"
        run: |
          tgz="$RUNNER_TOOL_CACHE/claude-code/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
          mkdir -p "$(dirname "$tgz")"
          if ! echo "$CLAUDE_CODE_TGZ_SHA256  $tgz" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 600 \
              -o "$tgz" "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
            echo "$CLAUDE_CODE_TGZ_SHA256  $tgz" | sha256sum -c -
          fi
          rm -rf "$RUNNER_TEMP/claude-code" && mkdir -p "$RUNNER_TEMP/claude-code"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/claude-code" package/claude
          chmod +x "$RUNNER_TEMP/claude-code/package/claude"
          "$RUNNER_TEMP/claude-code/package/claude" --version
          echo "path=$RUNNER_TEMP/claude-code/package/claude" >> "$GITHUB_OUTPUT"
      # Odoo core (odoo/ only, to check the ORM API), from a copy kept in the runner's tool
      # cache. actions/checkout cloned odoo/odoo on every run with blob:none and downloaded
      # the blobs of odoo/ in one go at `git checkout`, a step it does not retry: a stall
      # there failed the review (bitshop PR 3517, "curl 28 ... could not fetch from promisor
      # remote"). The copy is a sparse partial clone too, but the blobs it got stay between
      # runs, so a run fetches only what changed and a retry resumes. If GitHub stays
      # unreachable, the copy's older commit is used; without any, Argus reviews without it.
      - name: Odoo core from the runner's cache
        id: odoo
        continue-on-error: true
        env:
          ODOO_VERSION: ${{ inputs.odoo-version }}
        run: |
          src="$RUNNER_TOOL_CACHE/odoo-src/$ODOO_VERSION"
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "Attempt $i failed: $*" >&2
              sleep $((i * 15))
            done
            return 1
          }
          # A job cancelled mid-fetch leaves its lock behind (one job at a time per runner).
          rm -f "$src/.git/shallow.lock" "$src/.git/index.lock"
          if [ ! -d "$src/.git" ]; then
            rm -rf "$src" && mkdir -p "$src"
            git -C "$src" init -q
            git -C "$src" remote add origin https://github.com/odoo/odoo.git
            git -C "$src" config remote.origin.promisor true
            git -C "$src" config remote.origin.partialclonefilter blob:none
            git -C "$src" sparse-checkout set --cone odoo
          fi
          if retry git -C "$src" fetch -q --depth=1 --no-tags --filter=blob:none origin \
              "+refs/heads/$ODOO_VERSION:refs/remotes/origin/$ODOO_VERSION"; then
            # Fetches the missing blobs of odoo/ in one batch; the ones a stalled attempt got
            # stay, so the next attempt only fetches the rest.
            retry git -C "$src" checkout -q --force -B "$ODOO_VERSION" "origin/$ODOO_VERSION" || exit 1
          elif git -C "$src" rev-parse -q --verify HEAD >/dev/null && [ -d "$src/odoo" ]; then
            echo "::warning::GitHub unreachable: Odoo core from the cache's older commit."
          else
            exit 1
          fi
          rm -rf .odoo-src && mkdir .odoo-src && cp -r "$src/odoo" .odoo-src/
          echo "Odoo core $ODOO_VERSION at $(git -C "$src" rev-parse --short HEAD)"
      # Comments signed by the Argus GitHub App; the same token reads this repository.
      - name: Argus app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      # A freshly made app token may answer 404 ("Repository not found") for a few
      # minutes, seen on 27.10 07:17-07:45: wait until it sees the repository instead
      # of failing on the first git or gh call.
      - name: Wait until the Argus token sees the repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      # argus-ok says "Argus found nothing blocking or important on this head", for the
      # automerge workflow: it goes away when a new review starts and comes back only if
      # this one is clean.
      - name: Drop argus-ok until this review is done
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/argus-ok" --silent 2>/dev/null || true
      # The small shared repositories (these scripts, the rules, tb-odoo-lint) are kept as one
      # clone each in the runner's tool cache: a run only fetches what changed since the last
      # review (a new push on the same PR, or any other PR on this runner), instead of a fresh
      # actions/checkout of each (~30 s). The helper stays in $RUNNER_TEMP for the rules step.
      - name: Shared Argus scripts and lint, from the runner's cache
        env:
          AGENTS_REF: ${{ inputs.agents-ref }}
          WITH_LINT: ${{ inputs.lint }}
        run: |
          cat > "$RUNNER_TEMP/cached-checkout.sh" <<'SH'
          # cached_checkout <owner/repo> <ref> <path> <dest> [token]: <path> of <ref> into <dest>.
          cached_checkout() {
            local repo="$1" ref="$2" path="$3" dest="$4" token="${5:-}"
            local dir="$RUNNER_TOOL_CACHE/argus-src/${repo//\//_}"
            if [ ! -d "$dir/.git" ]; then
              rm -rf "$dir" && mkdir -p "$dir"
              git -C "$dir" init -q
              git -C "$dir" remote add origin "https://github.com/$repo.git"
            fi
            # A job cancelled mid-fetch leaves its lock behind (one job at a time per runner).
            rm -f "$dir/.git/shallow.lock" "$dir/.git/index.lock"
            if [ -n "$token" ]; then
              # Through the environment, not argv: the runners share one machine.
              local basic
              basic="$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')"
              echo "::add-mask::$basic"
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
              export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
            fi
            local i rev=FETCH_HEAD
            # A full commit SHA never changes: already in the clone, nothing to fetch.
            if [[ "$ref" =~ ^[0-9a-f]{40}$ ]] && git -C "$dir" cat-file -e "$ref^{commit}" 2>/dev/null; then
              rev="$ref"
            else
              for i in 1 2 3; do
                git -C "$dir" fetch -q --depth=1 --no-tags origin "$ref" && break
                [ "$i" = 3 ] && return 1
                echo "Attempt $i failed: fetch $repo $ref" >&2
                sleep $((i * 10))
              done
            fi
            rm -rf "$dest" && mkdir -p "$dest"
            git -C "$dir" archive "$rev" -- "$path" | tar -x -C "$dest"
            echo "$repo $ref at $(git -C "$dir" rev-parse --short "$rev")"
          }
          SH
          . "$RUNNER_TEMP/cached-checkout.sh"
          cached_checkout terrabit-solutions/ci-agents "$AGENTS_REF" argus .ci-agents
          # tb-odoo-lint (Python stdlib only) at a fixed commit, v1.5.0.
          if [ "$WITH_LINT" = "true" ]; then
            cached_checkout dhongu/terrabit-pre-commit-hooks 9aea6d5acb3560a6ab13e43ec7ee421dc76461ae \
              terrabit_pre_commit_hooks .tb-lint
          fi
      # The rules stay private, in terrabit-claude: the same app, installed on the organization,
      # reads them for every suite, also one outside the organization.
      - name: Rules token
        id: rules
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: terrabit-solutions
          repositories: terrabit-claude
          permission-contents: read
      - name: Wait until the rules token sees terrabit-claude
        env:
          GH_TOKEN: ${{ steps.rules.outputs.token }}
          REPO: terrabit-solutions/terrabit-claude
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      - name: Checkout the shared Argus rules
        env:
          RULES_TOKEN: ${{ steps.rules.outputs.token }}
        run: |
          . "$RUNNER_TEMP/cached-checkout.sh"
          cached_checkout terrabit-solutions/terrabit-claude main ci-agents/argus .argus-rules "$RULES_TOKEN"
      # The suite's own rules, from its base branch: the PR cannot change them.
      # Only one file is wanted (REVIEW.local.md), so no second checkout: the base commit is
      # fetched into the workspace clone (a commit it nearly has already) and the file read from it.
      - name: Read the suite's rules from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          rm -rf .argus-base && mkdir -p .argus-base/.github/argus
          git fetch -q --depth=1 --no-tags --filter=blob:none origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:.github/argus/REVIEW.local.md" 2>/dev/null; then
            git show "$BASE_SHA:.github/argus/REVIEW.local.md" > .argus-base/.github/argus/REVIEW.local.md
          fi
      - name: Prepare Argus rules
        run: |
          rm -f "$RUNNER_TEMP/argus-verdict"
          rm -rf .argus
          cp -r .ci-agents/argus .argus
          cp .argus-rules/ci-agents/argus/REVIEW.md .argus/REVIEW.md
          if [ -f .argus-base/.github/argus/REVIEW.local.md ]; then
            cp .argus-base/.github/argus/REVIEW.local.md .argus/REVIEW.local.md
          fi
          rm -rf .argus-base .argus-rules .ci-agents
          chmod +x .argus/*.sh .argus/inline.py
          # The inline comment buffer of the action's older runs, replayed by every later run
          # on this runner until now (see classify_inline_comments below).
          rm -f /tmp/inline-comments-buffer.jsonl
      # Its findings on the PR's files go to .argus/lint.json, for Argus to confirm or
      # reject. Advisory: a failure here leaves Argus to review as before.
      - name: Run tb-odoo-lint on the PR's files
        if: inputs.lint
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          trap 'rm -rf .tb-lint' EXIT
          files="$RUNNER_TEMP/lint-files.txt"
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '\.(py|xml)$' > "$files" || true
          if [ -s "$files" ]; then
            xargs -d '\n' python3 .tb-lint/terrabit_pre_commit_hooks/tb_odoo_lint.py \
              --json --warn-only < "$files" > "$RUNNER_TEMP/lint.json"
            mv "$RUNNER_TEMP/lint.json" .argus/lint.json
            python3 -c 'import json; print(len(json.load(open(".argus/lint.json"))), "findings")'
          else
            echo "No .py/.xml files in the PR."
          fi
      - name: Argus review
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          HOME: ${{ runner.temp }}/claude-home
          # Read by the .argus/ scripts.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        with:
          # Post inline comments at once, unbuffered: the action's buffer, a fixed
          # /tmp/inline-comments-buffer.jsonl, outlives the job on our persistent
          # runners and every later run (Mentor's too) replayed it on its own PR.
          classify_inline_comments: "false"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            ODOO VERSION: ${{ inputs.odoo-version }}
            ODOO CORE: ${{ steps.odoo.outcome == 'success' && '.odoo-src/odoo' || 'indisponibil la această rulare (rețea): nu afirma nimic despre API-ul ORM pe baza surselor Odoo' }}

            Fă review-ul acestui PR după regulile din .argus/REVIEW.md.
            Citește întâi fișierul acela și respectă-l întocmai.

            Comentariile pe linie le pui numai cu `.argus/inline.py` (unealta MCP de
            comentarii inline nu mai e disponibilă), un apel pe problemă:
            `.argus/inline.py --path <fișier> --line <n> --rule <regulă> --match '<cod>' --body '<text>'`
            (`--start <n>` pentru un interval). `--rule` e un nume scurt și stabil al regulii
            (ex. `o20-is-company`). `--match` e codul despre care e comentariul, exact cum apare
            pe linie: trebuie să fie pe o linie pe care PR-ul o adaugă. Doar pentru o linie
            neschimbată pe care schimbarea o strică adaugi `--context`, niciodată la regulile de
            tipar. Scriptul refuză liniile șterse și tiparele pe care PR-ul doar le șterge, și nu
            repostează un fir existent. Un refuz nu se reia și nu se numără în rezumat; un
            „deja comentat” se numără doar dacă problema e încă reală, fără alt apel.

            Comenzile Bash sunt permise doar în forma exactă din listă: o singură comandă pe apel,
            cu calea relativă (`.argus/comment.sh`, `.argus/inline.py`, `.argus/verdict.sh`, nu
            `/home/runner/...`), fără `cd`, `;`, `&&`, `|`, `>` sau `$(...)`. Diff-ul îl citești
            cu `gh pr diff <nr>` direct, iar fișierele cu uneltele Read/Grep/Glob. O comandă
            refuzată nu se reia sub altă formă compusă. Review-ul se încheie întotdeauna cu
            `.argus/verdict.sh`, chiar dacă n-ai găsit nimic.
          # The runner is persistent: file tools are limited to the job
          # workspace (repo + .odoo-src), and the runner's home dotfiles,
          # its credentials and system paths are denied outright.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "Read(./**),Grep(./**),Glob(./**),Bash(.argus/inline.py:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(.argus/comment.sh:*),Bash(.argus/needs-pacioli.sh),Bash(.argus/verdict.sh:*)"
            --disallowedTools "Read(~/.*),Read(~/.*/**),Read(~/runner-*/.*),Read(//etc/**),Read(//proc/**),Read(//root/**)"
      # A clean draft goes to Ready, which starts the tests and Mentor (events made with an
      # app token trigger workflows). Claude only reports the counts; this step decides, and
      # also counts the [blocant]/[important] comments Argus posted on this head, so a
      # misreported verdict can only hold a draft back. Label "wip" (any case, as contains()
      # in the condition) to keep the draft.
      # GitHub lets an app mark a PR ready only with contents write. Claude's token above
      # stays read-only; this one is made after Claude has finished, for that one call.
      - name: Argus token, to mark the draft ready
        id: ready-app
        if: github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'wip')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Wait until the ready token sees the repository
        if: steps.ready-app.outputs.token
        env:
          GH_TOKEN: ${{ steps.ready-app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      - name: Verdict - argus-ok, and Ready if the draft is clean
        id: verdict
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READY_TOKEN: ${{ steps.ready-app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # gh api, retried: an app token can still answer 404 now and then after it
          # first worked (27.10, after a clean review the PR stayed a draft).
          ghr() {
            local i
            for i in 1 2 3 4 5; do
              gh api "$@" && return 0
              echo "gh api $1 failed, retrying in $((i * 10))s." >&2
              sleep $((i * 10))
            done
            gh api "$@"
          }
          verdict="$RUNNER_TEMP/argus-verdict"
          if [ ! -s "$verdict" ]; then
            # A run without verdict used to end green and the draft just stayed a draft, so
            # nobody saw that the review had not happened (deltatech#3871, 29.10: Claude's
            # comment.sh call was refused and it never reached verdict.sh). Fail, so the job
            # is visibly red and can be re-run.
            echo "::error::No verdict from Argus: no argus-ok, a draft stays a draft. Re-run the job."
            exit 1
          fi
          read -r blocking important minor < "$verdict"
          echo "Argus: $blocking blocking, $important important, $minor minor."
          # The [blocant]/[important] comments Argus posted on this head count too, so a
          # misreported verdict can only hold the PR back, never approve it. Only threads
          # still open count: GitHub moves a comment's commit to the new head while its
          # line is unchanged, so a thread answered and resolved on an earlier push kept
          # the PR red on every later head (l10n-romania#732). REST comments do not say
          # whether their thread is resolved, hence GraphQL. The commit check also leaves
          # out outdated threads (their line changed): the new review decides on those.
          flags=$(ghr graphql --paginate -F owner="${REPO%%/*}" -F repo="${REPO#*/}" -F number="$PR_NUMBER" \
            -f query='query($owner: String!, $repo: String!, $number: Int!, $endCursor: String) {
              repository(owner: $owner, name: $repo) { pullRequest(number: $number) {
                reviewThreads(first: 100, after: $endCursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes { isResolved comments(first: 1) { nodes { author { login } body commit { oid } } } }
                } } } }' \
            --jq '.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved | not) | .comments.nodes[0]
              | select(.author.login == "argus-terrabit" and .commit.oid == env.HEAD_SHA)
              | select(.body | test("^\\*\\*\\[(blocant|important)\\]"))
              | .body | capture("^\\*\\*\\[(?<s>blocant|important)\\]").s')
          inline_blocking=$(grep -c '^blocant$' <<< "$flags" || true)
          inline_important=$(grep -c '^important$' <<< "$flags" || true)
          [ "$inline_blocking" -gt "$blocking" ] && blocking=$inline_blocking
          [ "$inline_important" -gt "$important" ] && important=$inline_important
          echo "blocking=$blocking" >> "$GITHUB_OUTPUT"
          echo "important=$important" >> "$GITHUB_OUTPUT"
          # The PR as it is now: same head, and whether wip was added meanwhile.
          state=$(ghr "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '"\(.draft) \(.head.sha) \(any(.labels[]; .name | ascii_downcase == "wip"))"')
          read -r now_draft now_head now_wip <<< "$state"
          if [ "$now_head" != "$HEAD_SHA" ]; then
            echo "New commits during the review ($now_head): the next review decides."
            exit 0
          fi
          # The review verdict, for the next step: approve when clean, request changes on a
          # blocking issue, only the summary comment when important ones are left.
          if [ "$blocking" != 0 ]; then
            event=REQUEST_CHANGES
          elif [ "$important" != 0 ]; then
            event=COMMENT
          else
            event=APPROVE
          fi
          echo "event=$event" >> "$GITHUB_OUTPUT"
          if [ "$event" != APPROVE ]; then
            echo "Issues to fix ($blocking blocking, $important important): no argus-ok, a draft stays a draft."
            exit 0
          fi
          ghr "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=argus-ok" --silent
          echo "Clean review: argus-ok."
          if [ "$now_draft" != true ] || [ "$now_wip" = true ] || [ -z "$READY_TOKEN" ]; then
            exit 0
          fi
          GH_TOKEN="$READY_TOKEN" gh pr ready "$PR_NUMBER" -R "$REPO"
          gh pr comment "$PR_NUMBER" -R "$REPO" --body "Review Argus curat: PR-ul trece pe Ready, pornesc testele și Mentor. (Eticheta \`wip\` îl ține ca draft.)"
      # Approve, request changes, or only the summary comment, by the counts of the step above;
      # Argus's earlier verdicts that no longer hold are dismissed.
      - name: Argus's verdict as a review
        if: "!cancelled() && steps.verdict.outputs.event != ''"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ steps.verdict.outputs.event }}
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
        run: python3 -I .argus/review_verdict.py "$REPO" "$PR_NUMBER" "$HEAD_SHA" "$EVENT" "$BLOCKING"
      # The action hides Claude's output. Show only the commands the
      # permission rules refused and, on failure, the final result text,
      # which carries the error (auth, quota, ...). The tokens used go to the
      # run's Summary page.
      - name: Show Claude error, refused commands and usage
        if: always()
        env:
          JOB_FAILED: ${{ job.status == 'failure' }}
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -s "$out" ]; then
            echo "Claude did not run: an earlier step failed, see its log."
            exit 0
          fi
          python3 - "$out" <<'EOF'
          import json, os, sys
          try:
              data = json.load(open(sys.argv[1]))
          except ValueError as err:
              sys.exit(f"Unreadable Claude output: {err}")
          for msg in data if isinstance(data, list) else [data]:
              if msg.get("type") != "result":
                  continue
              for denial in msg.get("permission_denials") or []:
                  print("Refused:", denial.get("tool_name"), json.dumps(denial.get("tool_input"), ensure_ascii=False))
              if os.environ.get("JOB_FAILED") == "true":
                  print(msg.get("result") or msg.get("errors") or msg)
              usage = msg.get("usage") or {}
              fmt = lambda n: f"{n or 0:,}".replace(",", ".")
              rows = [
                  ("Tokeni citiți (intrare)", fmt(usage.get("input_tokens"))),
                  ("Tokeni citiți din cache", fmt(usage.get("cache_read_input_tokens"))),
                  ("Tokeni scriși în cache", fmt(usage.get("cache_creation_input_tokens"))),
                  ("Tokeni scriși (ieșire)", fmt(usage.get("output_tokens"))),
                  ("Pași", msg.get("num_turns", "")),
                  ("Durată", f"{(msg.get('duration_ms') or 0) / 1000:.0f} s"),
                  ("Cost echivalent API", f"{msg.get('total_cost_usd') or 0:.3f} $".replace(".", ",")),
              ]
              for model, mu in (msg.get("modelUsage") or {}).items():
                  rows.append((f"Model {model}", f"{fmt(mu.get('inputTokens'))} intrare, {fmt(mu.get('outputTokens'))} ieșire"))
              table = "| Consum Argus | |\n|---|---|\n" + "\n".join(f"| {k} | {v} |" for k, v in rows)
              table += "\n\nPe abonament nu se plătește pe review: costul arată doar cât consumă din limita de 5 ore și din cea săptămânală.\n"
              print(table)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                      fh.write(table)
          EOF
      # Last: blocking or important issues turn the check red, so a suite that makes
      # "argus / review" a required check blocks the merge (an admin can still bypass it).
      - name: Fail while blocking or important issues are left
        if: always() && !cancelled() && steps.verdict.outputs.blocking != ''
        env:
          BLOCKING: ${{ steps.verdict.outputs.blocking }}
          IMPORTANT: ${{ steps.verdict.outputs.important }}
        run: |
          if [ "$BLOCKING" != 0 ] || [ "$IMPORTANT" != 0 ]; then
            echo "::error::Argus: $BLOCKING blocking and $IMPORTANT important issues left; fix them and push to the PR."
            exit 1
          fi
