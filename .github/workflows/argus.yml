name: argus

# Argus, the advisory AI review of a suite's pull requests: it comments, it never blocks the
# merge, and it moves a clean draft to Ready (label "wip" to keep it a draft). Called by .github/workflows/argus.yml of each suite (which sets the triggers). The
# scripts come from this repository, the rules (ci-agents/argus/REVIEW.md) from the private
# terrabit-solutions/terrabit-claude, plus the suite's own .github/argus/REVIEW.local.md from
# its base branch, so a PR cannot change how it is reviewed.

on:
  workflow_call:
    inputs:
      agents-ref:
        description: Branch or tag of terrabit-solutions/ci-agents for the scripts (the rules follow terrabit-claude main).
        type: string
        default: main
      runs-on:
        description: >-
          JSON runner labels for all the jobs, e.g. '"ubuntu-latest"' for a suite outside
          the org (its own GitHub-hosted minutes). Empty: the org's VPS runners, the light
          jobs on the "agents" ones and Mentor's screenshots on the "odoo" ones, as the tests.
        type: string
        default: ""
      odoo-version:
        description: >-
          The suite's Odoo series (its base branch), e.g. "20.0": the Odoo core Argus
          checks the ORM API against, and the rules it applies (REVIEW.md, per version).
        type: string
        default: "19.0"
      lint:
        description: >-
          Run tb-odoo-lint on the PR's .py/.xml files first; Argus confirms or rejects
          each finding (pilot: off by default).
        type: boolean
        default: false
    # Declared so that a caller outside the organization can pass them by name:
    # `secrets: inherit` only crosses repositories of the same organization.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ARGUS_APP_ID:
        required: false
      ARGUS_APP_PRIVATE_KEY:
        required: false

jobs:
  review:
    # PRs from forks get no secrets: skip them. Mentor's pushes only add the
    # consultant sheet, already audited by its own checker, and the action
    # refuses runs started by a bot: skip them too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != 'mentor-terrabit[bot]'
    # The org has no GitHub-hosted minutes: its VPS runners, on the "agents" ones kept
    # for the agents, so a review does not wait behind the test shards.
    # At job level, so a skipped run (Mentor's push) does not cancel the
    # review in progress; a new push by the author does.
    concurrency:
      group: argus-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runs-on || '["self-hosted", "linux", "agents"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          # Argus may read the workspace: keep the token out of .git/config.
          persist-credentials: false
      # Argus reads the PR and comments through `gh`, which the runner may lack.
      - name: Install gh if missing
        env:
          GH_VERSION: "2.102.0"
          # From gh_2.102.0_checksums.txt of the release.
          GH_SHA256: "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386"
        run: |
          if ! command -v gh >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi
      # The action's own Bun setup needs `unzip`, which the runner lacks:
      # extract with Python instead, once per runner (the tool cache persists).
      - name: Install Bun without unzip
        id: bun
        env:
          BUN_VERSION: "1.4.4"
          # From SHASUMS256.txt of the release.
          BUN_SHA256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
        run: |
          # Only the zip is cached; it is checked on every run and extracted
          # fresh, so a binary altered on the persistent runner is never used.
          zip="$RUNNER_TOOL_CACHE/bun/bun-${BUN_VERSION}-linux-x64.zip"
          mkdir -p "$(dirname "$zip")"
          if ! echo "$BUN_SHA256  $zip" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL -o "$zip" \
              "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
            echo "$BUN_SHA256  $zip" | sha256sum -c -
          fi
          python3 -m zipfile -e "$zip" "$RUNNER_TEMP/bun"
          chmod +x "$RUNNER_TEMP/bun/bun-linux-x64/bun"
          echo "path=$RUNNER_TEMP/bun/bun-linux-x64/bun" >> "$GITHUB_OUTPUT"
      - name: Checkout Odoo core (odoo/ only, to check the ORM API)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: odoo/odoo
          ref: ${{ inputs.odoo-version }}
          path: .odoo-src
          fetch-depth: 1
          # Argus may read the workspace: keep the token out of .git/config.
          persist-credentials: false
          sparse-checkout: odoo
          sparse-checkout-cone-mode: true
      # Comments signed by the Argus GitHub App; the same token reads this repository.
      - name: Argus app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      # A freshly made app token may answer 404 ("Repository not found") for a few
      # minutes, seen on 27.10 07:17-07:45: wait until it sees the repository instead
      # of failing on the first git or gh call.
      - name: Wait until the Argus token sees the repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      # argus-ok says "Argus found nothing blocking or important on this head", for the
      # automerge workflow: it goes away when a new review starts and comes back only if
      # this one is clean.
      - name: Drop argus-ok until this review is done
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/argus-ok" --silent 2>/dev/null || true
      - name: Checkout the shared Argus scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: terrabit-solutions/ci-agents
          ref: ${{ inputs.agents-ref }}
          path: .ci-agents
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: argus
      # The rules stay private, in terrabit-claude: the same app, installed on the organization,
      # reads them for every suite, also one outside the organization.
      - name: Rules token
        id: rules
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: terrabit-solutions
          repositories: terrabit-claude
          permission-contents: read
      - name: Wait until the rules token sees terrabit-claude
        env:
          GH_TOKEN: ${{ steps.rules.outputs.token }}
          REPO: terrabit-solutions/terrabit-claude
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      - name: Checkout the shared Argus rules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: terrabit-solutions/terrabit-claude
          ref: main
          token: ${{ steps.rules.outputs.token }}
          path: .argus-rules
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ci-agents/argus
      # The suite's own rules, from its base branch: the PR cannot change them.
      - name: Checkout the suite's rules from the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .argus-base
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github/argus
          sparse-checkout-cone-mode: true
      - name: Prepare Argus rules
        run: |
          rm -f "$RUNNER_TEMP/argus-verdict"
          rm -rf .argus
          cp -r .ci-agents/argus .argus
          cp .argus-rules/ci-agents/argus/REVIEW.md .argus/REVIEW.md
          if [ -f .argus-base/.github/argus/REVIEW.local.md ]; then
            cp .argus-base/.github/argus/REVIEW.local.md .argus/REVIEW.local.md
          fi
          rm -rf .argus-base .argus-rules .ci-agents
          chmod +x .argus/*.sh
      # tb-odoo-lint (Python stdlib only) at a fixed commit, v1.5.0.
      - name: Checkout tb-odoo-lint
        if: inputs.lint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: dhongu/terrabit-pre-commit-hooks
          ref: 9aea6d5acb3560a6ab13e43ec7ee421dc76461ae # v1.5.0
          path: .tb-lint
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: terrabit_pre_commit_hooks
      # Its findings on the PR's files go to .argus/lint.json, for Argus to confirm or
      # reject. Advisory: a failure here leaves Argus to review as before.
      - name: Run tb-odoo-lint on the PR's files
        if: inputs.lint
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          trap 'rm -rf .tb-lint' EXIT
          files="$RUNNER_TEMP/lint-files.txt"
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '\.(py|xml)$' > "$files" || true
          if [ -s "$files" ]; then
            xargs -d '\n' python3 .tb-lint/terrabit_pre_commit_hooks/tb_odoo_lint.py \
              --json --warn-only < "$files" > "$RUNNER_TEMP/lint.json"
            mv "$RUNNER_TEMP/lint.json" .argus/lint.json
            python3 -c 'import json; print(len(json.load(open(".argus/lint.json"))), "findings")'
          else
            echo "No .py/.xml files in the PR."
          fi
      - name: Argus review
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          HOME: ${{ runner.temp }}/claude-home
          # Read by the .argus/*.sh scripts.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            ODOO VERSION: ${{ inputs.odoo-version }}

            Fă review-ul acestui PR după regulile din .argus/REVIEW.md.
            Citește întâi fișierul acela și respectă-l întocmai.
          # The runner is persistent: file tools are limited to the job
          # workspace (repo + .odoo-src), and the runner's home dotfiles,
          # its credentials and system paths are denied outright.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "Read(./**),Grep(./**),Glob(./**),mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(.argus/comment.sh:*),Bash(.argus/needs-pacioli.sh),Bash(.argus/verdict.sh:*)"
            --disallowedTools "Read(~/.*),Read(~/.*/**),Read(~/runner-*/.*),Read(//etc/**),Read(//proc/**),Read(//root/**)"
      # A clean draft goes to Ready, which starts the tests and Mentor (events made with an
      # app token trigger workflows). Claude only reports the counts; this step decides, and
      # also counts the [blocant]/[important] comments Argus posted on this head, so a
      # misreported verdict can only hold a draft back. Label "wip" (any case, as contains()
      # in the condition) to keep the draft.
      # GitHub lets an app mark a PR ready only with contents write. Claude's token above
      # stays read-only; this one is made after Claude has finished, for that one call.
      - name: Argus token, to mark the draft ready
        id: ready-app
        if: github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'wip')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Wait until the ready token sees the repository
        if: steps.ready-app.outputs.token
        env:
          GH_TOKEN: ${{ steps.ready-app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      - name: Verdict - argus-ok, and Ready if the draft is clean
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          READY_TOKEN: ${{ steps.ready-app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # gh api, retried: an app token can still answer 404 now and then after it
          # first worked (27.10, after a clean review the PR stayed a draft).
          ghr() {
            local i
            for i in 1 2 3 4 5; do
              gh api "$@" && return 0
              echo "gh api $1 failed, retrying in $((i * 10))s." >&2
              sleep $((i * 10))
            done
            gh api "$@"
          }
          verdict="$RUNNER_TEMP/argus-verdict"
          if [ ! -s "$verdict" ]; then
            echo "No verdict from Argus: no argus-ok, a draft stays a draft."
            exit 0
          fi
          read -r blocking important minor < "$verdict"
          echo "Argus: $blocking blocking, $important important, $minor minor."
          if [ "$blocking" != 0 ] || [ "$important" != 0 ]; then
            echo "Issues to fix: no argus-ok, a draft stays a draft."
            exit 0
          fi
          # The PR as it is now: same head, and whether wip was added meanwhile.
          state=$(ghr "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '"\(.draft) \(.head.sha) \(any(.labels[]; .name | ascii_downcase == "wip"))"')
          read -r now_draft now_head now_wip <<< "$state"
          if [ "$now_head" != "$HEAD_SHA" ]; then
            echo "New commits during the review ($now_head): the next review decides."
            exit 0
          fi
          flagged=$(ghr "repos/$REPO/pulls/$PR_NUMBER/comments" --paginate --jq '.[]
            | select(.user.login == "argus-terrabit[bot]" and .commit_id == env.HEAD_SHA)
            | select(.body | test("^\\*\\*\\[(blocant|important)\\]"))
            | .id' | wc -l)
          if [ "$flagged" -gt 0 ]; then
            echo "$flagged blocking or important comments on this head: no argus-ok."
            exit 0
          fi
          ghr "repos/$REPO/issues/$PR_NUMBER/labels" -f "labels[]=argus-ok" --silent
          echo "Clean review: argus-ok."
          if [ "$now_draft" != true ] || [ "$now_wip" = true ] || [ -z "$READY_TOKEN" ]; then
            exit 0
          fi
          GH_TOKEN="$READY_TOKEN" gh pr ready "$PR_NUMBER" -R "$REPO"
          gh pr comment "$PR_NUMBER" -R "$REPO" --body "Review Argus curat: PR-ul trece pe Ready, pornesc testele și Mentor. (Eticheta \`wip\` îl ține ca draft.)"
      # The action hides Claude's output. Show only the commands the
      # permission rules refused and, on failure, the final result text,
      # which carries the error (auth, quota, ...). The tokens used go to the
      # run's Summary page.
      - name: Show Claude error, refused commands and usage
        if: always()
        env:
          JOB_FAILED: ${{ job.status == 'failure' }}
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -s "$out" ]; then
            echo "Claude did not run: an earlier step failed, see its log."
            exit 0
          fi
          python3 - "$out" <<'EOF'
          import json, os, sys
          try:
              data = json.load(open(sys.argv[1]))
          except ValueError as err:
              sys.exit(f"Unreadable Claude output: {err}")
          for msg in data if isinstance(data, list) else [data]:
              if msg.get("type") != "result":
                  continue
              for denial in msg.get("permission_denials") or []:
                  print("Refused:", denial.get("tool_name"), json.dumps(denial.get("tool_input"), ensure_ascii=False))
              if os.environ.get("JOB_FAILED") == "true":
                  print(msg.get("result") or msg.get("errors") or msg)
              usage = msg.get("usage") or {}
              fmt = lambda n: f"{n or 0:,}".replace(",", ".")
              rows = [
                  ("Tokeni citiți (intrare)", fmt(usage.get("input_tokens"))),
                  ("Tokeni citiți din cache", fmt(usage.get("cache_read_input_tokens"))),
                  ("Tokeni scriși în cache", fmt(usage.get("cache_creation_input_tokens"))),
                  ("Tokeni scriși (ieșire)", fmt(usage.get("output_tokens"))),
                  ("Pași", msg.get("num_turns", "")),
                  ("Durată", f"{(msg.get('duration_ms') or 0) / 1000:.0f} s"),
                  ("Cost echivalent API", f"{msg.get('total_cost_usd') or 0:.3f} $".replace(".", ",")),
              ]
              for model, mu in (msg.get("modelUsage") or {}).items():
                  rows.append((f"Model {model}", f"{fmt(mu.get('inputTokens'))} intrare, {fmt(mu.get('outputTokens'))} ieșire"))
              table = "| Consum Argus | |\n|---|---|\n" + "\n".join(f"| {k} | {v} |" for k, v in rows)
              table += "\n\nPe abonament nu se plătește pe review: costul arată doar cât consumă din limita de 5 ore și din cea săptămânală.\n"
              print(table)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                      fh.write(table)
          EOF
