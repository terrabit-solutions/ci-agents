name: tests

# The tests of this repository's scripts (stdlib only, no install), on the org's VPS
# runners: the org has no GitHub-hosted minutes.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ["self-hosted", "linux", "agents"]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
