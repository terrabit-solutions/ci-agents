name: tests

# The tests of this repository's scripts (stdlib only, no install). On a GitHub-hosted
# runner: the repository is public, so the minutes are free, a fork's pull request must
# not run on the VPS, and a job asking for the org's self-hosted runners stayed queued
# here for hours (29.10) while they were idle.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
