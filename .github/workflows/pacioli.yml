name: pacioli

# Pacioli's pre-check of a PR labelled needs-pacioli (Argus adds the label when a PR creates or
# changes accounting entries, accounts or taxes): Claude compares the entries in the diff with
# the RO accounting reference and posts "## Pre-verificare Pacioli" with a proposed verdict and
# the reviewed commit. Advisory only: the verdict that opens Argus's gate ("## Verificare
# Pacioli", "Verdict: OK", "Commit:") is still written by a person, who also removes the label.
# Called by .github/workflows/pacioli.yml of each suite, on labeled/synchronize/reopened; this
# job runs when the label is added and on every new head of a PR that has it. The script comes
# from this repository, the rules (ci-agents/pacioli/PACIOLI.md, the pacioli agent of the
# terrabit-odoo plugin) from the private terrabit-solutions/terrabit-claude and the reference
# from terrabit-solutions/pacioli, so a PR cannot change how it is checked.

on:
  workflow_call:
    inputs:
      agents-ref:
        description: Branch or tag of terrabit-solutions/ci-agents for the script.
        type: string
        default: main
      rules-ref:
        description: >-
          Branch of terrabit-solutions/terrabit-claude for the rules (PACIOLI.md, the pacioli
          agent). Keep main; another branch only to try a change of the rules on a test PR.
        type: string
        default: main
      runs-on:
        description: >-
          JSON runner labels, e.g. '"ubuntu-latest"' for a suite outside the org (its own
          GitHub-hosted minutes). Empty: the org's VPS runners labelled "agents".
        type: string
        default: ""
      odoo-version:
        description: The suite's Odoo series (its base branch), e.g. "20.0", given to Pacioli.
        type: string
        default: "19.0"
    # Declared so that a caller outside the organization can pass them by name:
    # `secrets: inherit` only crosses repositories of the same organization.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ARGUS_APP_ID:
        required: false
      ARGUS_APP_PRIVATE_KEY:
        required: false

jobs:
  precheck:
    # PRs from forks get no secrets: skip them. Mentor's pushes only add the consultant
    # sheet: skip them too. Otherwise: the label just added, or a new head of a PR that has it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.sender.login != 'mentor-terrabit[bot]' &&
      ((github.event.action == 'labeled' && github.event.label.name == 'needs-pacioli') ||
       (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'needs-pacioli')))
    # At job level, so a skipped run (another label) does not cancel the check in progress;
    # a new push does.
    concurrency:
      group: pacioli-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runs-on || '["self-hosted", "linux", "agents"]') }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      REPO: ${{ github.repository }}
    steps:
      # Pacioli reads the code at the commit it names in its comment, not the merge ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          # Pacioli may read the workspace: keep the token out of .git/config.
          persist-credentials: false
      # Pacioli reads the PR and comments through `gh`, which the runner may lack.
      - name: Install gh if missing
        env:
          GH_VERSION: "2.102.0"
          # From gh_2.102.0_checksums.txt of the release.
          GH_SHA256: "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386"
        run: |
          if ! command -v gh >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            echo "$GH_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
          fi
      # Comments signed by the Argus GitHub App (so never mistaken for the human verdict,
      # which Argus only accepts from a person).
      - name: Argus app token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      # A freshly made app token may answer 404 for a few minutes (seen on 27.10).
      - name: Wait until the Argus token sees the repository
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            gh api "repos/$REPO" --silent 2>/dev/null && exit 0
            echo "The new token does not see $REPO yet (404), retrying in $((i * 5))s."
            sleep $((i * 5))
          done
          echo "::error::The app token still does not see $REPO after 3 minutes."
          exit 1
      # The label added again, or reopened, on a head already pre-checked: nothing new to say.
      - name: Already pre-checked on this head?
        id: seen
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          n=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[]
            | select(.user.type == "Bot" and (.body | startswith("## Pre-verificare Pacioli")))
            | select(.body | contains("Commit: " + env.HEAD_SHA))
            | .id' | wc -l)
          if [ "$n" -gt 0 ]; then
            echo "Pacioli already pre-checked $HEAD_SHA: nothing to do."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout the shared Pacioli script
        if: steps.seen.outputs.done != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: terrabit-solutions/ci-agents
          ref: ${{ inputs.agents-ref }}
          path: .ci-agents
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: pacioli
      # Argus Terrabit app (read-only): the RO accounting reference (pacioli) and the Terrabit
      # plugin with the pacioli agent and the pre-check rules (terrabit-claude), for every suite.
      - name: Read token
        id: read
        if: steps.seen.outputs.done != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: terrabit-solutions
          repositories: pacioli,terrabit-claude
          permission-contents: read
      - name: Wait until the read token sees terrabit-claude
        if: steps.seen.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
        run: |
          for r in terrabit-solutions/terrabit-claude terrabit-solutions/pacioli; do
            for i in 1 2 3 4 5 6 7 8 9; do
              gh api "repos/$r" --silent 2>/dev/null && continue 2
              [ "$i" = 9 ] && { echo "::error::The app token still does not see $r after 3 minutes."; exit 1; }
              echo "The new token does not see $r yet (404), retrying in $((i * 5))s."
              sleep $((i * 5))
            done
          done
      # The references of Pacioli do not depend on the Odoo version: one branch, main.
      - name: Checkout the RO accounting reference
        if: steps.seen.outputs.done != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: terrabit-solutions/pacioli
          ref: main
          token: ${{ steps.read.outputs.token }}
          path: .pacioli-ref
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: skills/contabilitate-ro
      - name: Checkout the Pacioli rules
        if: steps.seen.outputs.done != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: terrabit-solutions/terrabit-claude
          ref: ${{ inputs.rules-ref }}
          token: ${{ steps.read.outputs.token }}
          path: .pacioli-rules
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            plugins/terrabit-odoo/agents
            ci-agents/pacioli
      # Everything Pacioli reads goes under .pacioli/, with the PR diff, so Claude needs no git
      # command. The action restores .claude/ from the base branch, so nothing is put there.
      - name: Prepare Pacioli
        if: steps.seen.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          rm -f "$RUNNER_TEMP/pacioli-posted"
          rm -rf .pacioli
          mkdir .pacioli
          cp .ci-agents/pacioli/*.sh .pacioli/
          chmod +x .pacioli/*.sh
          cp .pacioli-rules/ci-agents/pacioli/PACIOLI.md .pacioli/PACIOLI.md
          cp .pacioli-rules/plugins/terrabit-odoo/agents/pacioli.md .pacioli/pacioli.md
          cp -r .pacioli-ref/skills/contabilitate-ro .pacioli/contabilitate-ro
          rm -rf .ci-agents .pacioli-rules .pacioli-ref
          # gh pr diff refuses very large PRs: then the per-file patches of the API.
          if ! gh pr diff "$PR_NUMBER" -R "$REPO" > .pacioli/pr.diff; then
            gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
              --jq '.[] | "diff --git a/\(.filename) b/\(.filename)\n\(.patch // "(patch too large: read the file)")"' \
              > .pacioli/pr.diff
          fi
          echo "PR diff: $(wc -l < .pacioli/pr.diff) lines."
      # The action's own Bun setup needs `unzip`, which the runner lacks:
      # extract with Python instead, once per runner (the tool cache persists).
      - name: Install Bun without unzip
        if: steps.seen.outputs.done != 'true'
        id: bun
        env:
          BUN_VERSION: "1.4.4"
          # From SHASUMS256.txt of the release.
          BUN_SHA256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
        run: |
          zip="$RUNNER_TOOL_CACHE/bun/bun-${BUN_VERSION}-linux-x64.zip"
          mkdir -p "$(dirname "$zip")"
          if ! echo "$BUN_SHA256  $zip" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL -o "$zip" \
              "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
            echo "$BUN_SHA256  $zip" | sha256sum -c -
          fi
          python3 -m zipfile -e "$zip" "$RUNNER_TEMP/bun"
          chmod +x "$RUNNER_TEMP/bun/bun-linux-x64/bun"
          echo "path=$RUNNER_TEMP/bun/bun-linux-x64/bun" >> "$GITHUB_OUTPUT"
      - name: Pacioli pre-check
        if: steps.seen.outputs.done != 'true'
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          HOME: ${{ runner.temp }}/claude-home
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          # Argus adds the label with its app token: the action refuses bot-started runs otherwise.
          allowed_bots: argus-terrabit
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            COMMIT: ${{ github.event.pull_request.head.sha }}
            ODOO VERSION: ${{ inputs.odoo-version }}

            Fă pre-verificarea Pacioli a acestui PR după regulile din .pacioli/PACIOLI.md.
            Citește întâi fișierul acela și respectă-l întocmai.
          # The runner is persistent: file tools are limited to the job workspace, and the
          # runner's home dotfiles, its credentials and system paths are denied outright.
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Read(./**),Grep(./**),Glob(./**),Bash(.pacioli/comment.sh:*)"
            --disallowedTools "Read(~/.*),Read(~/.*/**),Read(~/runner-*/.*),Read(//etc/**),Read(//proc/**),Read(//root/**)"
      - name: Check the pre-check was posted
        if: steps.seen.outputs.done != 'true'
        run: |
          if [ ! -f "$RUNNER_TEMP/pacioli-posted" ]; then
            echo "::error::Pacioli posted no pre-check comment (see the next step)."
            exit 1
          fi
      # The action hides Claude's output. Show only the commands the permission rules
      # refused and, on failure, the final result text, which carries the error (auth,
      # quota, ...). The tokens used go to the log and to the run's Summary page.
      - name: Show Claude error, refused commands and usage
        if: always() && steps.seen.outputs.done != 'true'
        env:
          JOB_FAILED: ${{ job.status == 'failure' }}
        run: |
          out="$RUNNER_TEMP/claude-execution-output.json"
          if [ ! -s "$out" ]; then
            echo "Claude did not run: an earlier step failed, see its log."
            exit 0
          fi
          python3 - "$out" <<'EOF'
          import json, os, sys
          try:
              data = json.load(open(sys.argv[1]))
          except ValueError as err:
              sys.exit(f"Unreadable Claude output: {err}")
          for msg in data if isinstance(data, list) else [data]:
              if msg.get("type") != "result":
                  continue
              for denial in msg.get("permission_denials") or []:
                  print("Refused:", denial.get("tool_name"), json.dumps(denial.get("tool_input"), ensure_ascii=False))
              if os.environ.get("JOB_FAILED") == "true":
                  print(msg.get("result") or msg.get("errors") or msg)
              usage = msg.get("usage") or {}
              fmt = lambda n: f"{n or 0:,}".replace(",", ".")
              rows = [
                  ("Tokeni citiți (intrare)", fmt(usage.get("input_tokens"))),
                  ("Tokeni citiți din cache", fmt(usage.get("cache_read_input_tokens"))),
                  ("Tokeni scriși în cache", fmt(usage.get("cache_creation_input_tokens"))),
                  ("Tokeni scriși (ieșire)", fmt(usage.get("output_tokens"))),
                  ("Pași", msg.get("num_turns", "")),
                  ("Durată", f"{(msg.get('duration_ms') or 0) / 1000:.0f} s"),
                  ("Cost echivalent API", f"{msg.get('total_cost_usd') or 0:.3f} $".replace(".", ",")),
              ]
              for model, mu in (msg.get("modelUsage") or {}).items():
                  rows.append((f"Model {model}", f"{fmt(mu.get('inputTokens'))} intrare, {fmt(mu.get('outputTokens'))} ieșire"))
              table = "| Consum Pacioli | |\n|---|---|\n" + "\n".join(f"| {k} | {v} |" for k, v in rows)
              table += "\n\nPe abonament nu se plătește pe pre-verificare: costul arată doar cât consumă din limita de 5 ore și din cea săptămânală.\n"
              print(table)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                      fh.write(table)
          EOF
