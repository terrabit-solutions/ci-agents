name: mentor

# Mentor, called by .github/workflows/mentor.yml of each suite (which sets the triggers).
# Review only: checks that each module the PR changes functionally has its consultant sheet
# (readme/FISA_CONSULTANT.md), complete and with a step for each change: one light job, no Odoo,
# nothing committed, the report as a PR review. The job that writes the sheets and regenerates
# the screenshots (as fisa-completa) is in mentor_full.yml, so a suite on review shows no skipped jobs.
# Scripts come from this repository and the rules (ci-agents/mentor/MENTOR.md)
# from the private terrabit-solutions/terrabit-claude, so a PR cannot change them. Label a PR "mentor-skip" to leave it alone.
#
# The suite provides two scripts on its base branch, for the screenshots job:
#   .github/mentor/private_repos.sh  the private clones (the only step with credentials)
#   .github/mentor/install.sh        what its test.yml installs before `pip install -r`

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          Deprecated and ignored (kept so callers that still pass it do not fail): this file is
          review only; "full" is mentor_full.yml.
        type: string
        default: review
      agents-ref:
        description: Branch or tag of terrabit-solutions/ci-agents for the scripts (the rules follow terrabit-claude main).
        type: string
        default: main
      runs-on:
        description: >-
          JSON runner labels for all the jobs, e.g. '"ubuntu-latest"' for a suite outside
          the org (its own GitHub-hosted minutes). Empty: the org's VPS runners, the light
          jobs on the "agents" ones and Mentor's screenshots on the "odoo" ones, as the tests.
        type: string
        default: ""
      odoo-version:
        description: >-
          The suite's Odoo series (its base branch), e.g. "20.0": the OCA image of the
          screenshots job (Python 3.10 for 19.0, 3.12 from 20.0) and the branch of the
          screenshot tooling and of the RO accounting reference.
        type: string
        default: "19.0"
      postgres-image:
        description: The Postgres image of the suite's test.yml (pgvector where Enterprise `ai` is in).
        type: string
        default: postgres:13.0
    # Declared so that a caller outside the organization can pass them by name:
    # `secrets: inherit` only crosses repositories of the same organization.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ARGUS_APP_ID:
        required: false
      ARGUS_APP_PRIVATE_KEY:
        required: false
      MENTOR_APP_ID:
        required: false
      MENTOR_APP_PRIVATE_KEY:
        required: false
      BITSHOP:
        required: false
      ENTERPRISE_TOKEN:
        required: false
      TERRABIT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  review:
    # Mentor review: checks the sheets, writes nothing on the PR.
    # For each module the PR changes functionally: review_check.py checks without AI that the
    # sheet exists and has the fisa-modul structure (sections 1-11, a screenshot on every step,
    # the screenshots it refers to present), then one read-only Claude session checks that its
    # steps cover what the PR changes. The report goes as a PR review (Approve, Request changes
    # on a critical or major finding or on more than 2 minor ones, Comment otherwise) and mentor-ok
    # comes only without them. One job on the "agents" runners: no Odoo, no
    # Chrome, no commit. The sheet itself is made locally, with Mentor (fisa-completa).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'mentor-skip')
    concurrency:
      group: mentor-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ${{ fromJSON(inputs.runs-on || '["self-hosted", "linux", "agents"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # The history without the old file contents: the screenshots make most of the
          # repository, and a full clone took minutes on a busy runner.
          filter: blob:none
          # No module in the working tree yet: checking out every file of the suite fetched
          # each blob of it (55 s for 3938 files on bitshop). The next step adds the modules
          # of the PR.
          sparse-checkout: .github
          # Claude may read the workspace: keep the token out of .git/config.
          persist-credentials: false
      # Right after the suite, before anything that can fail: Mentor's report on the PR
      # (pr_comment.py) needs it even when the job fails at the next step.
      - name: Checkout the Mentor scripts
        uses: terrabit-solutions/ci-agents/.github/actions/cached-checkout@main
        with:
          repository: terrabit-solutions/ci-agents
          ref: ${{ inputs.agents-ref }}
          dest: .ci-agents
          paths: |
            mentor
      # Without the token in .git/config git cannot fetch a missing blob later, so the ones
      # select_modules, review_check and the PR diff read (the modules the PR changes, at
      # the merge base and in the PR commits) come here, with the token only in this
      # step's environment.
      - name: The file contents of the PR range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
        run: |
          base=$(git merge-base "$BASE" "$HEAD")
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git diff --no-renames --name-only "$base" "$HEAD" | sed -n 's|/.*||p' | sort -u > "$RUNNER_TEMP/dirs"
          echo "$(wc -l < "$RUNNER_TEMP/dirs") folders changed in the PR"
          # The modules of the PR in the working tree, their screenshots included.
          xargs -r git sparse-checkout add < "$RUNNER_TEMP/dirs"
          { xargs -r git ls-tree -r "$base" -- < "$RUNNER_TEMP/dirs" | awk '$2 == "blob" { print $3 }'
            git rev-list --objects --missing=print "$base..$HEAD" | sed -n 's/^?//p'; } \
            | sort -u > "$RUNNER_TEMP/blobs"
          echo "$(wc -l < "$RUNNER_TEMP/blobs") blobs of the PR range"
          # As git's own lazy fetch (promisor-remote.c): without negotiation. With the default
          # one the client sends its commits as "have", the base among them, and the server may
          # leave out a wanted blob it can reach from them, as if the client had it: "bad
          # revision" and "did not send all necessary objects" (bitshop#3520, a blob of the
          # base, on the reused workspace of the runners).
          if [ -s "$RUNNER_TEMP/blobs" ] && ! git -c fetch.negotiationAlgorithm=noop fetch \
              --no-tags --no-write-fetch-head --recurse-submodules=no \
              --filter=blob:none --stdin origin < "$RUNNER_TEMP/blobs"; then
            # Still short: cat-file asks for each blob it lacks, one by one, through git's lazy
            # fetch (the token is in the environment), and names those the server does not have.
            echo "::warning::The batch fetch of the blobs failed; fetching the missing ones one by one."
            if git cat-file --batch-check < "$RUNNER_TEMP/blobs" | grep ' missing$'; then
              echo "::error::Blobs of the PR range that the server did not send."
              exit 1
            fi
          fi
      # mentor-ok says "the sheets of this PR are there and complete", for the automerge
      # workflow: it goes away now and comes back only if this run ends clean.
      # Mentor's own app labels it, so mentor-ok shows as Mentor's.
      - name: Label token
        id: label
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liSlv87PMCx8Yz2Y # Mentor Terrabit, public Client ID
          private-key: ${{ secrets.MENTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: Drop mentor-ok until this run is done
        env:
          GH_TOKEN: ${{ steps.label.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # curl, not gh: the VPS runners have no gh.
        run: |
          curl -fsS -o /dev/null -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/mentor-ok" 2>/dev/null || true
      - name: Modules whose sheet must follow the PR
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "$BASE" "$HEAD")
          python3 -I .ci-agents/mentor/select_modules.py "$base" "$HEAD" \
            mentor-terrabit --limit 10 > "$RUNNER_TEMP/selection.json"
          python3 - "$RUNNER_TEMP/selection.json" <<'EOF'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          json.dump(data["selected"], open(".mentor-modules.json", "w"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"count={len(data['selected'])}\n")
          lines = [f"- `{m['module']}`: {m['reason']}" for m in data["selected"]]
          lines += [f"- `{m}`: lăsat pentru un push următor (cel mult 10 module pe rulare)" for m in data["skipped"]]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Mentor review\n\n" + ("\n".join(lines) or "Nicio fișă de verificat.") + "\n\n")
          EOF
          echo "base=$base" >> "$GITHUB_OUTPUT"
      # Without AI: the sheet exists, its sections, a screenshot on every step, the screenshots
      # present. Claude runs only for the modules that have a sheet.
      - name: Check the sheets without AI
        id: precheck
        if: steps.select.outputs.count != '0'
        env:
          BASE: ${{ steps.select.outputs.base }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I .ci-agents/mentor/review_check.py check "$BASE" "$HEAD" .mentor-modules.json \
            > .mentor-precheck.json
          sheets=$(python3 -c 'import json;print(sum(1 for m in json.load(open(".mentor-precheck.json")) if m["sheet"]))')
          echo "sheets=$sheets" >> "$GITHUB_OUTPUT"
      # Argus Terrabit app (read-only): the Terrabit plugin, with the fisa-modul skill and
      # Mentor's rules.
      - name: Read token
        id: read
        if: steps.precheck.outputs.sheets > 0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liGeN7tupqZ8jQoZ # Argus Terrabit, public Client ID
          private-key: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
          owner: terrabit-solutions
          repositories: terrabit-claude
          permission-contents: read
      - name: Checkout the Terrabit plugin
        if: steps.precheck.outputs.sheets > 0
        uses: terrabit-solutions/ci-agents/.github/actions/cached-checkout@main
        with:
          repository: terrabit-solutions/terrabit-claude
          ref: main
          token: ${{ steps.read.outputs.token }}
          dest: .mentor/plugin
          paths: |
            plugins/terrabit-odoo/skills/fisa-modul
            ci-agents/mentor
      # As in the sheet job: the skill and the rules under .mentor/, from terrabit-claude main,
      # and the PR diff on the selected modules, so Claude needs no git command.
      - name: Prepare Mentor
        if: steps.precheck.outputs.sheets > 0
        env:
          BASE: ${{ steps.select.outputs.base }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          cp -r .mentor/plugin/plugins/terrabit-odoo/skills/fisa-modul .mentor/fisa-modul
          cp .mentor/plugin/ci-agents/mentor/MENTOR.md .mentor/MENTOR.md
          mods=$(python3 -c 'import json;print(" ".join(m["module"] for m in json.load(open(".mentor-modules.json"))))')
          git diff "$BASE" "$HEAD" -- $mods > .mentor/pr.diff
      # The action's own Bun setup needs `unzip`, which the runner lacks.
      - name: Install Bun without unzip
        id: bun
        env:
          BUN_VERSION: "1.4.4"
          # SHA-256 of bun-linux-x64-1.4.4.tgz, the official npm package @oven/bun-linux-x64
          # (npm integrity sha512-CHbbkmHVM28T1GFq+6GL4Ao4ujwwYwj1CxFFwEFzLanPfNsId9AhbIP0Q4reWuWBkGimUkoQygrK7Rgjtj3vog==).
          BUN_TGZ_SHA256: "93ca5a2abe45f3bcac6dd55baff8bb06c4ac824b70f89650b54e5c8b80dbef18"
        run: |
          # From npm, not GitHub Releases: on 08.11.2026 both github.com/.../releases/download
          # and the release asset API answered 504 for hours. Only the archive is cached; it is
          # checked on every run and extracted fresh, so a binary altered on the persistent
          # runner is never used.
          tgz="$RUNNER_TOOL_CACHE/bun/bun-linux-x64-${BUN_VERSION}.tgz"
          mkdir -p "$(dirname "$tgz")"
          if ! echo "$BUN_TGZ_SHA256  $tgz" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 300 \
              -o "$tgz" "https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-${BUN_VERSION}.tgz"
            echo "$BUN_TGZ_SHA256  $tgz" | sha256sum -c -
          fi
          rm -rf "$RUNNER_TEMP/bun" && mkdir -p "$RUNNER_TEMP/bun"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bun" package/bin/bun
          chmod +x "$RUNNER_TEMP/bun/package/bin/bun"
          echo "path=$RUNNER_TEMP/bun/package/bin/bun" >> "$GITHUB_OUTPUT"
      # Claude Code from npm, not the action's own `curl https://claude.ai/install.sh`, which
      # fetches the 290 MB binary on every job: on 09.11.2026 that download kept dying with
      # `Connection reset by peer` and Argus failed before the review. Same scheme as Bun: the
      # archive is cached in the tool cache, checked on every run and extracted fresh. Keep
      # CLAUDE_CODE_VERSION in step with the one claude-code-action pins (v1.0.261: 2.1.310).
      - name: Install Claude Code
        id: claude
        env:
          CLAUDE_CODE_VERSION: "2.1.310"
          # SHA-256 of claude-code-linux-x64-2.1.310.tgz, the official npm package
          # @anthropic-ai/claude-code-linux-x64 (npm integrity
          # sha512-CuzpJrMBbqaR3+1SiLrBtPV3w/cFvcqBfhe9kNskzZ2Fm6KXa7v0l7tM+Ln6l5QLb79WoU0CcacXnYtsygbe6A==).
          CLAUDE_CODE_TGZ_SHA256: "8c90b0170d08fdb370db282c61d74897b834fc2569dd14c35eb1e491212dc6de"
        run: |
          tgz="$RUNNER_TOOL_CACHE/claude-code/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
          mkdir -p "$(dirname "$tgz")"
          if ! echo "$CLAUDE_CODE_TGZ_SHA256  $tgz" | sha256sum -c --status - 2>/dev/null; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 20 --max-time 600 \
              -o "$tgz" "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
            echo "$CLAUDE_CODE_TGZ_SHA256  $tgz" | sha256sum -c -
          fi
          rm -rf "$RUNNER_TEMP/claude-code" && mkdir -p "$RUNNER_TEMP/claude-code"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/claude-code" package/claude
          chmod +x "$RUNNER_TEMP/claude-code/package/claude"
          "$RUNNER_TEMP/claude-code/package/claude" --version
          echo "path=$RUNNER_TEMP/claude-code/package/claude" >> "$GITHUB_OUTPUT"
      # claude-code-action posts the inline comments of the review in its post step with
      # its github_token, and the caller's workflow gives GITHUB_TOKEN only contents: read
      # (a reusable workflow cannot raise it): Mentor's app token does it, else the run
      # keeps GITHUB_TOKEN and the inline comments are the only thing lost.
      - name: Review token
        id: reviewtoken
        if: steps.precheck.outputs.sheets > 0
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liSlv87PMCx8Yz2Y # Mentor Terrabit, public Client ID
          private-key: ${{ secrets.MENTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      - name: Mentor reviewer - checks the steps against the PR
        id: reviewer
        if: steps.precheck.outputs.sheets > 0
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          HOME: ${{ runner.temp }}/claude-home
        with:
          # Post inline comments at once, unbuffered: the action's buffer, a fixed
          # /tmp/inline-comments-buffer.jsonl, outlives the job on our persistent
          # runners and every later run (Mentor's too) replayed it on its own PR.
          classify_inline_comments: "false"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.reviewtoken.outputs.token || secrets.GITHUB_TOKEN }}
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          path_to_claude_code_executable: ${{ steps.claude.outputs.path }}
          allowed_bots: argus-terrabit
          prompt: |
            Lucrezi ca Mentor pe PR-ul #${{ github.event.pull_request.number }}
            (bază ${{ github.event.pull_request.base.sha }}). Citește întâi `.mentor/MENTOR.md`
            și respectă-l întocmai; modulele și verificările fără AI sunt în `.mentor-precheck.json`.
            Rolul tău: **recenzentul**. Nu modifici fișele; scrie `.mentor-review.json`.
          claude_args: |
            --model sonnet
            --max-turns 60
            --allowedTools "Read(./**),Grep(./**),Glob(./**),Edit(./.mentor-review.json),Write(./.mentor-review.json),Bash(ls:*)"
            --disallowedTools "Read(~/.*),Read(~/.*/**),Read(~/runner-*/.*),Read(//etc/**),Read(//proc/**),Read(//root/**)"
      - name: Keep the review session output
        if: always() && steps.reviewer.outcome != 'skipped' && steps.reviewer.outcome != ''
        run: cp "$RUNNER_TEMP/claude-execution-output.json" "$RUNNER_TEMP/mentor-review.json" 2>/dev/null || true
      - name: The findings of both checks
        if: "!cancelled() && steps.select.outputs.count != '0'"
        run: |
          python3 -I .ci-agents/mentor/review_check.py merge .mentor-precheck.json .mentor-review.json \
            > .mentor-verify.json
      - name: mentor-ok, if everything is clean
        id: verdict
        if: success()
        env:
          GH_TOKEN: ${{ steps.label.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COUNT: ${{ steps.select.outputs.count }}
        run: |
          if [ "$COUNT" != 0 ]; then
            left=$(python3 -I .ci-agents/mentor/pr_comment.py --blocking .mentor-verify.json)
            echo "left=$left" >> "$GITHUB_OUTPUT"
            if [ "$left" != 0 ]; then
              echo "Findings left ($left): no mentor-ok, the check fails after the report."
              exit 0
            fi
          fi
          curl -fsS -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -d '{"labels":["mentor-ok"]}' \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels"
          echo "Sheets there and complete: mentor-ok."
      - name: Show what the Mentor session did
        if: always() && steps.reviewer.outcome != 'skipped' && steps.reviewer.outcome != ''
        run: python3 -I .ci-agents/mentor/show_sessions.py "$RUNNER_TEMP"
      - name: Comment token
        id: comment
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liSlv87PMCx8Yz2Y # Mentor Terrabit, public Client ID
          private-key: ${{ secrets.MENTOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - name: No comment token
        if: always() && !cancelled() && steps.comment.outcome == 'failure'
        run: echo "::warning::Mentor's app has no Pull requests write permission yet; no PR comment."
      - name: Mentor's report on the PR
        if: always() && !cancelled() && steps.comment.outcome == 'success'
        continue-on-error: true
        env:
          MENTOR_TOKEN: ${{ steps.comment.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: review
          # Approve only when no step before failed (the reviewer session included).
          JOB_OK: ${{ job.status == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -I .ci-agents/mentor/pr_comment.py "$REPO" "$PR_NUMBER" "$BRANCH" "$PR_SHA" \
            .mentor-precheck.json .mentor-verify.json | tee -a "$GITHUB_STEP_SUMMARY"
      # Last, after the report: critical or major findings, or more than 2 minor ones (pr_comment.py
      # MAX_MINOR), turn the check red, so a suite
      # that makes "mentor / review" a required check blocks the merge (an admin can still
      # bypass it), not only automerge through the missing mentor-ok.
      - name: Fail while blocking findings are left
        if: always() && !cancelled() && steps.verdict.outputs.left != '' && steps.verdict.outputs.left != '0'
        env:
          LEFT: ${{ steps.verdict.outputs.left }}
        run: |
          echo "::error::Mentor: $LEFT blocking findings left (critical, major, or minor above 2); make or complete the sheet with Mentor (fisa-completa) and push it to the PR."
          exit 1
